version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/songloft.lpk

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: songloft

build:
  run_buildscript: false

images:
  - id: songloft
    target: service
    service: songloft-app
    source: songloft/songloft
    channel: stable
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: direct

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Songloft
    summary: 自托管个人音乐服务器
