params:
  - id: admin_username
    type: string
    name: "admin username"
    description: "Administrator username for Songloft"
    default_value: "admin"
    optional: false

  - id: admin_password
    type: secret
    name: "admin password"
    description: "Administrator password for Songloft (minimum 8 characters)"
    default_value: "admin123"
    optional: false

  - id: music_dir_name
    type: string
    name: "music directory name under user document directory"
    description: "the Songloft will play the special music, it can be a directory named 'music' or 'others'(directory will be created if not exist), then you can select /music in the software interface to play"
    default_value: "music"

locales:
  zh:
    admin_username:
      name: "管理员用户名"
      description: "Songloft 管理员登录用户名"

    admin_password:
      name: "管理员密码"
      description: "Songloft 管理员登录密码（至少 8 位）"

    music_dir_name:
      name: "音乐目录名称"
      description: "Songloft将播放指定目录下的音乐，您可以选择您主目录下的文件夹，比如'music'或'others'(如果目录不存在，将会自动创建），然后你可以通过在软件界面选择/music进行播放"
